plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}

android {
    namespace 'com.example.piastcity'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.piastcity"
        minSdk 30
        targetSdk 35

        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.3'
    }
}

dependencies {
    // Compose
    def compose_version = "1.6.0"

    // Import the Compose BOM
    implementation platform('androidx.compose:compose-bom:2023.08.00') // Use the latest stable version
    androidTestImplementation platform('androidx.compose:compose-bom:2023.08.00')

    // Your other Compose dependencies
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'

    // Add the ui-tooling dependencies
    implementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation("io.coil-kt:coil-compose:2.6.0")
    // Mosty łączące ViewModel i LiveData z Jetpack Compose
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.1"
    implementation "androidx.compose.runtime:runtime-livedata:1.6.7"
    implementation 'com.google.maps.android:maps-compose:4.4.1'
    implementation 'com.google.android.gms:play-services-location:21.2.0' // Potrzebne do FusedLocationProviderClient
    implementation "androidx.compose.material:material-icons-extended:1.6.7"

//
//    implementation platform("androidx.compose:compose-bom:$compose_version")
//    implementation 'androidx.compose.ui:ui'
//    implementation 'androidx.compose.material3:material3'
//    implementation 'androidx.compose.ui:ui-tooling-preview'
//    implementation 'androidx.compose.foundation:foundation'
//    debugImplementation 'androidx.compose.ui:ui-tooling'
//    implementation 'androidx.activity:activity-compose:1.9.0'

    // AndroidX / UI
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.1'

    // Google Maps
    implementation 'com.google.android.gms:play-services-maps:18.2.0'

    // Firebase (BoM + main modules, bez -ktx)
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'

    // FirebaseUI (login UI)
    implementation 'com.firebaseui:firebase-ui-auth:8.0.2'

    // Obrazki
    implementation 'com.squareup.picasso:picasso:2.8'

    // 3rd-party (JitPack) – stary projekt, może kiedyś wymagać podmiany
    implementation 'com.github.Spikeysanju:ZoomRecylerLayout:1.0'

    // Testy
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
